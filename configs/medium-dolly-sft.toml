# Instruction fine-tune of the `medium` (~303M) FineWeb-Edu base on Dolly-15k.
#
#   gls eval ppl --ckpt runs/medium-fineweb --corpus dolly      # baseline
#   gls train --config configs/medium-dolly-sft.toml --wandb
#   gls eval ppl --ckpt runs/medium-dolly-sft --corpus dolly    # after
#   gls eval harness --ckpt runs/medium-dolly-sft               # lambada/arc_easy/piqa
#   # resume after a kill (init_from is ignored once the run has its own state):
#   gls train --config configs/medium-dolly-sft.toml --resume auto

tier = "medium"
corpus = "dolly"
init_from = "runs/medium-fineweb"
steps = 400

# 16 x 8 accum = 128 example-draws/step; ~3.5x the 14k train split over 400 steps
# (sampling is with replacement, not epoch-based).
batch_size = 16
grad_accum = 8

# Below the small run's 2e-5: the medium base actually learned language during
# pretraining, so the fine-tune should nudge more gently than it did on the
# barely-trained smoke-test model. Revisit if the holdout loss is still falling
# fast at step 400.
lr = 1e-5
warmup_steps = 20
min_lr_frac = 0.1

# Dolly ships train-only; carve a deterministic 5% holdout by example.
val_fraction = 0.05

log_interval = 10
eval_interval = 50
eval_iters = 40
ckpt_interval = 100
keep_last = 3

run_name = "medium-dolly-sft"
wandb_project = "gls-model"
