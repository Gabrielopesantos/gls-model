# Development-tier pretrain: `medium` (~303M) on FineWeb-Edu.
# Numbers here are a starting point, not a tuned recipe - adjust `steps` and
# `lr` once the loss curve on the real corpus is visible in W&B.
#
#   gls data prepare --corpus fineweb-edu --split train --shard-tokens 100_000_000
#   gls train --config configs/medium-fineweb.toml --wandb
#   # resume after a kill:
#   gls train --config configs/medium-fineweb.toml --resume auto --wandb

tier = "medium"
corpus = "fineweb-edu"
steps = 20000

# 8 x 16 accum x 2048 ctx = 262k tokens/step
batch_size = 8
grad_accum = 16

lr = 3e-4
min_lr_frac = 0.1
warmup_steps = 300
weight_decay = 0.1
grad_clip = 1.0

# Static step shapes, so the forward compiles once. First step pays the trace.
compile = true

# fineweb-edu has no upstream val split; carve a tail holdout
val_fraction = 0.005

log_interval = 20
eval_interval = 500
eval_iters = 100
ckpt_interval = 1000
keep_last = 3

# Stop paying for steps that are not moving the holdout. 8 evals x 500 steps = a
# 4000-step (20%) flat stretch ends the run. min_improvement filters eval noise
# so a genuinely flat curve is what trips it. patience = 0 disables.
patience = 8
min_improvement = 0.005

# Checkpoints land on the instance's ephemeral disk - copy each one off-box as it
# is written. {ckpt} is the step dir just saved, {run} the run dir. Best-effort
# and non-blocking: a failed upload warns and training continues. The remote copy
# is free to accumulate past keep_last - that is the point of having it.
# sync_cmd = "rsync -a --mkpath {ckpt} REMOTE:gls-runs/medium-fineweb/"

run_name = "medium-fineweb"
wandb_project = "gls-model"
