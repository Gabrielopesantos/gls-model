# Phase 1 development-tier pretrain: `medium` (~303M) on FineWeb-Edu.
# Numbers here are a starting point, not a tuned recipe - adjust `steps` and
# `lr` once the loss curve on the real corpus is visible in W&B.
#
#   python -m gls.data prepare --corpus fineweb-edu --split train --shard-tokens 100_000_000
#   python -m gls.train --config configs/medium-fineweb.toml --wandb
#   # resume after a kill:
#   python -m gls.train --config configs/medium-fineweb.toml --resume auto --wandb

tier = "medium"
corpus = "fineweb-edu"
steps = 20000

# 8 x 16 accum x 2048 ctx = 262k tokens/step
batch_size = 8
grad_accum = 16

lr = 3e-4
min_lr_frac = 0.1
warmup_steps = 300
weight_decay = 0.1
grad_clip = 1.0

# fineweb-edu has no upstream val split; carve a tail holdout
val_fraction = 0.005

log_interval = 20
eval_interval = 500
eval_iters = 100
ckpt_interval = 1000
keep_last = 3

run_name = "medium-fineweb"
wandb_project = "gls-model"
