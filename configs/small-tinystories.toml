# Smoke test.
#
#   gls data prepare --corpus tinystories --split train --limit 120000
#   gls data prepare --corpus tinystories --split val   --limit 12000
#   gls train --config configs/small-tinystories.toml

tier = "small"
corpus = "tinystories"
steps = 1200

lr = 6e-4
warmup_steps = 60

log_interval = 10
eval_interval = 100
eval_iters = 40
ckpt_interval = 300
keep_last = 3

run_name = "small-tinystories"
